<!DOCTYPE html>
<html lang="mk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Нарачката е примена | Свет на децата</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '940198738676816');
    fbq('track', 'PageView');
    (function () {
      var img = new Image();
      img.src = "https://www.facebook.com/tr/?id=940198738676816&ev=PageView&dl="
        + encodeURIComponent(location.href)
        + "&rl=" + encodeURIComponent(document.referrer || "")
        + "&if=false&ts=" + Date.now();
    })();
  </script>
  <noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=940198738676816&ev=PageView&noscript=1" alt=""></noscript>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">652</span>
        Свет на децата
      </a>
    </div>
  </header>
  <main class="thanks">
    <div class="wrap">
      <article class="thanks-card">
        <div class="check" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12.5 9.2 17 19 7"/></svg>
        </div>
        <p class="section-kicker">Нарачка</p>
        <h1 id="thanks-title">Ја примивме нарачката.</h1>
        <p class="lead" id="thanks-lead">Те контактираме за потврда. Плаќањето сè уште не е поминато — го средиме заедно.</p>
        <div class="steps" id="thanks-steps"></div>
        <a class="btn" id="pdf-download" href="#" hidden>Симни го PDF-от</a>
        <a class="btn secondary" href="index.html">Назад кон страницата</a>
      </article>
    </div>
  </main>
  <script>
    (function () {
      var title = document.getElementById("thanks-title");
      var lead = document.getElementById("thanks-lead");
      var steps = document.getElementById("thanks-steps");
      var params = new URLSearchParams(location.search);
      var sessionId = params.get("session_id");

      function render(order) {
        if (!order) {
          title.textContent = "Ако нарачката помина, наскоро се јавуваме.";
          lead.textContent = "Ако формата не ја испрати, врати се и пробај повторно.";
          return;
        }
        var planId = order.id || order.plan || "komplet";
        var eventId = order.eventId || (sessionId ? "stripe-" + sessionId : "purchase-" + planId);
        var isPurchase = order.paid || order.pay === "door";
        if (isPurchase && sessionStorage.getItem("purchaseSent") !== eventId) {
          var purchase = {
            content_name: "652 комбинации — " + (order.name || planId),
            content_ids: [planId],
            content_type: "product",
            value: Number(order.price) || 0,
            currency: "MKD"
          };
          if (typeof fbq === "function") fbq("track", "Purchase", purchase, { eventID: eventId });
          var img = new Image();
          img.src = "https://www.facebook.com/tr/?id=940198738676816&ev=Purchase&dl="
            + encodeURIComponent(location.href)
            + "&if=false&ts=" + Date.now()
            + "&eid=" + encodeURIComponent(eventId)
            + "&cd[value]=" + encodeURIComponent(String(purchase.value))
            + "&cd[currency]=MKD"
            + "&cd[content_type]=product"
            + "&cd[content_ids]=" + encodeURIComponent(planId)
            + "&cd[content_name]=" + encodeURIComponent(purchase.content_name);
          sessionStorage.setItem("purchaseSent", eventId);
        }
        var who = order.buyer ? ", " + order.buyer : "";
        title.textContent = "Фала" + who + ". " + (order.paid ? "Уплатата е примена." : "Нарачката е примена.");
        lead.textContent = order.name + " · " + order.label + ".";

        var lines = [];
        if (order.pay === "door" && order.id === "komplet") {
          lines.push("Плаќаш при подигнување на пратката.");
          lines.push("Дигиталната верзија ја праќаме на твојата е-пошта кога ќе ја подигнеш пратката.");
          lines.push("Печатената верзија ја носиме на адресата од нарачката.");
        } else if (order.pay === "door") {
          lines.push("Плаќаш при подигнување на пратката.");
          lines.push("Печатената верзија ја носиме на адресата од нарачката.");
        } else if (order.id === "pdf") {
          lines.push("Плаќањето со картичка е примено.");
          lines.push("PDF-от е готов. Симни го од копчето подолу.");
        } else if (order.id === "komplet") {
          lines.push("Плаќањето со картичка е примено.");
          lines.push("PDF-от е готов. Симни го од копчето подолу.");
          lines.push("Печатената верзија ја праќаме на адресата.");
        } else {
          lines.push("Плаќањето со картичка е примено.");
          lines.push("Печатената верзија ја праќаме на адресата.");
        }
        steps.innerHTML = lines.map(function (line, index) {
          return "<div><strong>" + (index + 1) + "</strong><span>" + line + "</span></div>";
        }).join("");
        var download = document.getElementById("pdf-download");
        var canDownload = order.paid && sessionId && (planId === "pdf" || planId === "komplet");
        if (download) {
          download.hidden = !canDownload;
          if (canDownload) download.href = "/api/download?session_id=" + encodeURIComponent(sessionId);
        }
      }

      if (!sessionId) {
        var raw = sessionStorage.getItem("order");
        var stored = null;
        try { stored = raw ? JSON.parse(raw) : null; } catch (e) { stored = null; }
        render(stored);
        return;
      }

      title.textContent = "Ја проверуваме уплатата...";
      fetch("/api/session?session_id=" + encodeURIComponent(sessionId))
        .then(function (response) { return response.json(); })
        .then(function (order) {
          if (!order || !order.paid) {
            title.textContent = "Уплатата не е потврдена.";
            lead.textContent = "Ако парите ти се повлечени, јави ни се и ќе ја провериме уплатата.";
            return;
          }
          order.pay = "stripe";
          render(order);
        })
        .catch(function () {
          title.textContent = "Не можеме да ја провериме уплатата.";
          lead.textContent = "Ако плаќањето помина во Stripe, нарачката ја имаме. Провери ја е-поштата.";
        });
    })();
  </script>
</body>
</html>
