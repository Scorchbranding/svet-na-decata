<!DOCTYPE html>
<html lang="mk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Симни го PDF-от | Свет на децата</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">652</span>
        Свет на децата
      </a>
    </div>
  </header>
  <main class="thanks">
    <div class="wrap">
      <article class="thanks-card">
        <p class="section-kicker">Потврда</p>
        <h1 id="page-title">Го проверуваме линкот...</h1>
        <p class="lead" id="page-lead"></p>
        <div class="steps" id="page-steps"></div>
        <a class="btn" id="pdf-download" href="#" hidden>Симни го PDF-от</a>
      </article>
    </div>
  </main>
  <script>
    (function () {
      var title = document.getElementById("page-title");
      var lead = document.getElementById("page-lead");
      var steps = document.getElementById("page-steps");
      var download = document.getElementById("pdf-download");
      var sessionId = new URLSearchParams(location.search).get("session_id") || "";
      if (!sessionId) {
        title.textContent = "Линкот не е целосен.";
        lead.textContent = "Отвори ја пораката од е-поштата и притисни го линкот за симнување.";
        return;
      }
      fetch("/api/session?session_id=" + encodeURIComponent(sessionId))
        .then(function (response) { return response.json(); })
        .then(function (order) {
          var planId = order && (order.id || order.plan);
          if (!order || !order.paid || (planId !== "pdf" && planId !== "komplet")) {
            title.textContent = "Овој линк не носи PDF.";
            lead.textContent = "Линкот е за платена нарачка со дигитална верзија.";
            return;
          }
          title.textContent = "Потврда за нарачката";
          lead.textContent = (order.name || "652 комбинации") + " · " + (order.label || "") + ".";
          steps.innerHTML = "<div><strong>1</strong><span>Уплатата е примена.</span></div>"
            + "<div><strong>2</strong><span>Линкот останува активен. Можеш да го симнеш PDF-от повторно.</span></div>";
          download.hidden = false;
          download.href = "/api/download?session_id=" + encodeURIComponent(sessionId);
        })
        .catch(function () {
          title.textContent = "Не можеме да го отвориме линкот.";
          lead.textContent = "Пробај повторно за минута.";
        });
    })();
  </script>
</body>
</html>
